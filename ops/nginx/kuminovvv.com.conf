server {
    listen 80;
    listen [::]:80;
    server_name kuminovvv.com www.kuminovvv.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://kuminovvv.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kuminovvv.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/kuminovvv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuminovvv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://kuminovvv.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kuminovvv.com;
    server_tokens off;
    root /var/www/kuminovvv.com/current;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/kuminovvv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuminovvv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/kuminovvv-performance.conf;
    expires $kuminovvv_expires;

    access_log /var/log/nginx/kuminovvv.access.log;
    error_log /var/log/nginx/kuminovvv.error.log warn;

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\.(?!well-known) { deny all; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
