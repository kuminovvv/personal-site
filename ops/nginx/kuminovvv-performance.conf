# Include inside the canonical HTTPS server only.
# Ubuntu packages: libnginx-mod-http-brotli-filter, libnginx-mod-http-brotli-static.
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json
    application/xml text/xml application/manifest+json image/svg+xml;

brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css text/javascript application/javascript application/json
    application/xml text/xml application/manifest+json image/svg+xml;
